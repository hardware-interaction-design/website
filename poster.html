<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hardware Interaction Design Conference — Square Poster</title>
<!--
  1080 x 1080 share card for WhatsApp, Instagram and LinkedIn.
  Re-render after editing:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --disable-gpu --hide-scrollbars --window-size=1080,1080 \
    --screenshot=poster.png file://$PWD/poster.html

  One grid governs the page: three columns, 24px gutters, 72px side margins.
  The headline spans it, the photographs sit in it, the captions hang under it.
  Gold is spent once, on the date.
-->
<style>
  :root {
    --bg: #080c10;
    --ink: #f2f6fa;
    --grey: #728ba3;
    --line: #22313f;
    --gold: #f0a500;
    --mono: 'Courier New', Courier, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
  }
  .poster {
    width: 100%; height: 100%;
    padding: 76px 72px;
    display: flex; flex-direction: column;
  }

  h1 {
    font-size: 100px; line-height: .97; letter-spacing: -.035em;
    font-weight: 700;
  }
  .date {
    margin-top: 30px;
    font-size: 36px; font-weight: 500; letter-spacing: -.01em;
    color: var(--gold);
  }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: auto; }
  .col img.shot { width: 100%; height: auto; aspect-ratio: 5 / 4; object-fit: cover; display: block; }
  .kind {
    margin-top: 20px;
    font-family: var(--mono); font-size: 16px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--grey);
  }
  .brand { margin-top: 13px; display: flex; align-items: center; gap: 10px; height: 26px; }
  .brand img { width: auto; display: block; }
  .brand img.invert { filter: invert(1); }
  .brand span { font-size: 23px; font-weight: 600; letter-spacing: -.01em; }

  footer {
    margin-top: auto; padding-top: 26px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 20px; color: var(--grey);
  }
  footer .site { color: var(--ink); }
</style>
</head>
<body>
  <div class="poster">
    <h1>Hardware<br />Interaction Design<br />Conference</h1>
    <div class="date">Friday 23 October 2026</div>

    <div class="grid">
      <div class="col">
        <img class="shot" src="hapticlabs.jpg" width="1000" height="821" alt="Designing a haptic effect on a laptop with a Hapticlabs kit." />
        <div class="kind">Workshop</div>
        <div class="brand">
          <img class="invert" src="hapticlabs.svg" width="100" height="100" style="height: 24px;" alt="" /><span>Hapticlabs</span>
        </div>
      </div>

      <div class="col">
        <img class="shot" src="schematik.jpg" width="900" height="600" style="object-position: 28% 50%;" alt="An Arduino wired to a breadboard and a small display reading SCHEMATIK." />
        <div class="kind">Demo</div>
        <div class="brand">
          <img src="schematik.svg" width="371" height="55" style="height: 21px;" alt="Schematik" />
        </div>
      </div>

      <div class="col">
        <img class="shot" src="teufel.jpg" width="800" height="663" alt="A Teufel Bluetooth speaker laid out as separable parts." />
        <div class="kind">Talk</div>
        <div class="brand">
          <img src="teufel.svg" width="235" height="88" style="height: 25px;" alt="Teufel" />
        </div>
      </div>
    </div>

    <footer>
      <span>High Tech Campus, Eindhoven &middot; Dutch Design Week</span>
      <span class="site">hardwareux.com</span>
    </footer>
  </div>
</body>
</html>
